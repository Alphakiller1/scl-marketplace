name: Deploy (Vercel)

# Vercel's Git integration deploys every push to main. This workflow verifies
# that exact commit after the native deployment becomes healthy. Manual runs
# retain the Deploy Hook / CLI path as an operational recovery mechanism.
# Secrets live under GitHub → Environments → Production.
# See docs/SCL_DEPLOYMENT.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # Never cancel a run in progress. This workflow does not perform the
  # deployment — Vercel's Git integration does that on push, independently of
  # GitHub Actions — it verifies that the commit just merged is the one
  # production actually ends up serving. Cancelling therefore does not stop a
  # deploy; it only throws away the check that would notice a deploy going
  # wrong.
  #
  # With `true`, a run of merges cancels its own predecessors: on 2026-08-06,
  # thirteen PRs merged in quick succession and twelve verification runs were
  # cancelled, leaving only the last. Production was in fact serving every one
  # of those commits, but from the Actions tab it read as "every deploy today
  # was cancelled" — the wall of red was mistaken for an outage and sent a
  # session hunting a deployment failure that had never happened.
  #
  # Queued runs are cheap; a silent gap in release verification is not.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Trigger Vercel Deploy Hook
        id: hook
        if: github.event_name == 'workflow_dispatch'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "hook=false" >> "$GITHUB_OUTPUT"
            echo "No VERCEL_DEPLOY_HOOK_URL — will try CLI token fallback." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "hook=true" >> "$GITHUB_OUTPUT"
          echo "Posting Deploy Hook to rebuild live site from main…"
          HTTP=$(curl -sS -o /tmp/hook-body.txt -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK_URL")
          echo "HTTP $HTTP"
          cat /tmp/hook-body.txt || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            echo "### ✅ Deploy Hook accepted (HTTP $HTTP)" >> "$GITHUB_STEP_SUMMARY"
            echo "Vercel is rebuilding the live site from \`main\`. Refresh the live URL when that build finishes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Deploy Hook failed (HTTP $HTTP)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check CLI token fallback
        id: cfg
        if: github.event_name == 'workflow_dispatch' && steps.hook.outputs.hook != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN")
          [ -z "$VERCEL_ORG_ID" ] && missing+=("VERCEL_ORG_ID")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ❌ Nothing to deploy with"
              echo ""
              echo "Add **one** of these under GitHub → Settings → Environments → **Production** → Environment secrets:"
              echo ""
              echo "1. **Easiest:** \`VERCEL_DEPLOY_HOOK_URL\` — create at Vercel → Project → Settings → Git → Deploy Hooks (branch: \`main\`)"
              echo "2. **Or** all three: \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\`, \`VERCEL_PROJECT_ID\`"
              echo ""
              echo "Missing CLI secrets: ${missing[*]}"
              echo ""
              echo "Note: Vercel app env vars (DATABASE_URL, AUTH_SECRET, …) do **not** count here."
              echo "See docs/SCL_DEPLOYMENT.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Deploy to Vercel (CLI fallback)
        if: steps.cfg.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@58.9.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $URL"
          echo "### ✅ Production deploy: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify live release and core routes
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://scl-marketplace.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Waiting for $PRODUCTION_URL to serve $EXPECTED_SHA"
          ready=false
          for attempt in $(seq 1 60); do
            code=$(curl -L -sS --max-time 20 -o /tmp/scl-health.json -w "%{http_code}" \
              "$PRODUCTION_URL/api/health" || true)
            if [ "$code" = "200" ] && node -e '
              const health = require("/tmp/scl-health.json");
              const expected = process.argv[1];
              if (health.status !== "ok") process.exit(1);
              if (health.release !== expected) process.exit(1);
            ' "$EXPECTED_SHA"; then
              ready=true
              break
            fi
            echo "Attempt $attempt/60: HTTP $code; production has not reached the expected healthy release yet."
            sleep 10
          done

          if [ "$ready" != "true" ]; then
            echo "Production health verification failed."
            cat /tmp/scl-health.json || true
            live_release=$(node -e 'try{console.log(require("/tmp/scl-health.json").release||"unknown")}catch{console.log("unknown")}')
            {
              echo "### ❌ Production did not reach commit \`$EXPECTED_SHA\`"
              echo ""
              echo "Live release after 10 minutes: \`$live_release\`"
              echo ""
              echo "This usually means the **Vercel production build failed** (not just a slow deploy)."
              echo "Check Vercel → Project → Deployments for the failed build log."
              echo "Recent merges often fail when \`prisma migrate deploy\` aborts the build —"
              echo "builds must never \`exit 1\` on migration issues; use runtime schema patches instead."
              echo ""
              echo "Recovery: fix the build, merge to \`main\`, or run this workflow manually"
              echo "(workflow_dispatch) with \`VERCEL_DEPLOY_HOOK_URL\` set under Production secrets."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is required for the authenticated deep production gate."
            exit 1
          fi

          # Eight cache-busted rounds load public data stories sequentially
          # (Fluid pool is 5 connections). Each round retries a degraded page
          # so one ISR/pool miss does not fail the gate. Explicit health
          # markers prevent a 200 page with empty fallback data from passing.
          node scripts/verify-production-release.mjs \
            "$PRODUCTION_URL" "$EXPECTED_SHA" 8 2000

          echo "### ✅ Live release verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit \`$EXPECTED_SHA\` passed eight deep data, odds-provider, package-integrity, and public-page rounds." >> "$GITHUB_STEP_SUMMARY"
