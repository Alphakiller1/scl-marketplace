name: Deploy (Vercel)

# On push to main, ask Vercel to rebuild the live site from main.
# Preferred: one Deploy Hook URL (simplest). Fallback: Vercel CLI token trio.
# Secrets live under GitHub → Environments → Production.
# See docs/SCL_DEPLOYMENT.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Trigger Vercel Deploy Hook
        id: hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "hook=false" >> "$GITHUB_OUTPUT"
            echo "No VERCEL_DEPLOY_HOOK_URL — will try CLI token fallback." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "hook=true" >> "$GITHUB_OUTPUT"
          echo "Posting Deploy Hook to rebuild live site from main…"
          HTTP=$(curl -sS -o /tmp/hook-body.txt -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK_URL")
          echo "HTTP $HTTP"
          cat /tmp/hook-body.txt || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            echo "### ✅ Deploy Hook accepted (HTTP $HTTP)" >> "$GITHUB_STEP_SUMMARY"
            echo "Vercel is rebuilding the live site from \`main\`. Refresh the live URL when that build finishes." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Deploy Hook failed (HTTP $HTTP)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check CLI token fallback
        id: cfg
        if: steps.hook.outputs.hook != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN")
          [ -z "$VERCEL_ORG_ID" ] && missing+=("VERCEL_ORG_ID")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("VERCEL_PROJECT_ID")
          if [ ${#missing[@]} -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ❌ Nothing to deploy with"
              echo ""
              echo "Add **one** of these under GitHub → Settings → Environments → **Production** → Environment secrets:"
              echo ""
              echo "1. **Easiest:** \`VERCEL_DEPLOY_HOOK_URL\` — create at Vercel → Project → Settings → Git → Deploy Hooks (branch: \`main\`)"
              echo "2. **Or** all three: \`VERCEL_TOKEN\`, \`VERCEL_ORG_ID\`, \`VERCEL_PROJECT_ID\`"
              echo ""
              echo "Missing CLI secrets: ${missing[*]}"
              echo ""
              echo "Note: Vercel app env vars (DATABASE_URL, AUTH_SECRET, …) do **not** count here."
              echo "See docs/SCL_DEPLOYMENT.md."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Deploy to Vercel (CLI fallback)
        if: steps.cfg.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $URL"
          echo "### ✅ Production deploy: $URL" >> "$GITHUB_STEP_SUMMARY"

  # Temporary founding-roster populate. Remove once real cappers replace ghosts.
  seed-ghosts:
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for production deployment
        run: |
          echo "Waiting for Vercel to serve /api/admin/seed-ghosts…"
          for i in $(seq 1 40); do
            code=$(curl -sS -o /tmp/probe.json -w "%{http_code}" \
              "https://scl-marketplace.vercel.app/api/admin/seed-ghosts" || true)
            echo "probe $i HTTP $code"
            # 401 = route live (auth required). 200 = open. 404 = still old deploy.
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Endpoint never became ready" >&2
          exit 1

      - name: Chunked ghost seed
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "### ❌ CRON_SECRET not available — cannot seed ghosts" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          URL="https://scl-marketplace.vercel.app/api/admin/seed-ghosts"
          auth() { curl -sS -H "Authorization: Bearer ${CRON_SECRET}" -H "Content-Type: application/json" -H "Accept: application/json" "$@"; }

          echo "Wiping prior ghosts…"
          wipe=$(auth -X POST -d '{"wipeOnly":true}' "$URL")
          echo "$wipe"
          echo "$wipe" | node -e 'const d=JSON.parse(require("fs").readFileSync(0,"utf8")); if(!d.ok) process.exit(1)'

          offset=0
          limit=3
          for i in $(seq 1 40); do
            echo "Chunk offset=$offset limit=$limit"
            body=$(node -e "console.log(JSON.stringify({skipWipe:true,offset:$offset,limit:$limit}))")
            resp=$(auth -X POST -d "$body" "$URL")
            echo "$resp"
            parsed=$(echo "$resp" | node -e '
              const d=JSON.parse(require("fs").readFileSync(0,"utf8"));
              if(!d.ok) { console.error(d.error||d); process.exit(2); }
              console.log([d.seeded||0,d.remaining||0,d.done?1:0,d.total||0].join(" "));
            ')
            seeded=$(echo "$parsed" | awk '{print $1}')
            remaining=$(echo "$parsed" | awk '{print $2}')
            done=$(echo "$parsed" | awk '{print $3}')
            total=$(echo "$parsed" | awk '{print $4}')
            offset=$((offset + seeded))
            echo "progress offset=$offset remaining=$remaining total=$total"
            if [ "$done" = "1" ] || [ "$remaining" = "0" ]; then
              echo "### ✅ Ghost seed complete (roster $total)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo "### ❌ Seed incomplete" >> "$GITHUB_STEP_SUMMARY"
          exit 1
