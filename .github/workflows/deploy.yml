name: Deploy (Vercel)

# Deploys to Vercel on push to main. Guarded: it no-ops cleanly until the three
# Vercel secrets are set, so it never fails before deployment is configured.
# Prefer the native Vercel GitHub integration; use this only for GitHub-driven
# deploys. See docs/SCL_DEPLOYMENT.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel config
        id: cfg
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Production deploys only run on main — skipping deploy for ${{ github.ref }}." >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Vercel secrets not set — skipping deploy. See docs/SCL_DEPLOYMENT.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Deploy to Vercel
        if: steps.cfg.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@latest
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $URL"
          echo "### ✅ Production deploy: $URL" >> "$GITHUB_STEP_SUMMARY"
