name: Strategic odds refresh

on:
  schedule:
    # Five runs a day, not ninety-six. This endpoint is metered: a single run
    # can warm the whole slate at ~31 Odds API credits per event, so cadence is
    # the largest lever on the bill and every extra run buys almost nothing —
    # the per-competition slots in `strategic-odds-policy.ts` fire at most once
    # or twice a day regardless of how often the cron knocks.
    #
    # Times are UTC; the comments are ET, which is what the slots reason in.
    # The DAYTIME gaps are all four hours, and that number is load-bearing:
    # `REFRESH_MAX_GAP_MINUTES` must stay >= the largest gap during which games
    # start, or a `before-first` window can fall entirely between two runs and
    # that competition simply never refreshes that day. See the invariant test
    # in `strategic-odds-cadence.test.ts`, which reads this file.
    - cron: "0 12 * * *" # 08:00 ET — morning slate, WNBA 08:00 fixed slot
    - cron: "0 16 * * *" # 12:00 ET — before MLB/soccer day games
    - cron: "0 20 * * *" # 16:00 ET — before evening WNBA/MLS/NFL preseason
    - cron: "0 0 * * *" # 20:00 ET — mid-evening top-up
    - cron: "0 3 * * *" # 23:00 ET — MLB 22:00 fixed slot, next-day lines
  workflow_dispatch:

concurrency:
  group: strategic-odds-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Call production odds scheduler
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CRON_ODDS_URL: ${{ secrets.CRON_ODDS_URL }}
        run: |
          test -n "$CRON_SECRET"
          URL="${CRON_ODDS_URL:-https://scl-marketplace.vercel.app/api/cron/odds-refresh}"
          # NO --retry here. This endpoint is metered and side-effecting: it
          # spends roughly 31 Odds API credits per event it warms, so a blanket
          # `--retry 3 --retry-all-errors` turned every scheduled run into four
          # paid refreshes. It retried on incomplete coverage — a state a retry
          # cannot fix, because books still will not have priced those markets a
          # minute later. Only the credits changed.
          #
          # `--max-time` is generous because a real refresh is slow (the route
          # allows 300s); it is a stuck-connection guard, not a retry budget.
          code=$(curl -sS --max-time 300 -o /tmp/odds.json -w "%{http_code}" -H "Authorization: $CRON_SECRET" "$URL")
          cat /tmp/odds.json
          echo

          # The request must have been serviced...
          test "$code" = "200"

          # ...and the board it produced must be complete. Incomplete coverage
          # fails the job so it stays visible in Actions, but costs one refresh
          # rather than four.
          ok=$(jq -r '.ok' /tmp/odds.json)
          if [ "$ok" != "true" ]; then
            echo "::error::Odds refresh completed with incomplete coverage (ok=$ok). See expandedFailures above."
            exit 1
          fi
