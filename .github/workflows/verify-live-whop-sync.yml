name: Verify live Whop sync

on:
  workflow_dispatch:
    inputs:
      capper_email:
        description: Existing SCL capper email
        required: true
        type: string
      company_id:
        description: Installed Whop business ID (biz_...)
        required: true
        type: string
      product_id:
        description: Dedicated free SCL sync-test product ID (prod_...)
        required: true
        type: string

concurrency:
  group: verify-live-whop-sync
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Run reversible verification inside Vercel
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CAPPER_EMAIL: ${{ inputs.capper_email }}
          COMPANY_ID: ${{ inputs.company_id }}
          PRODUCT_ID: ${{ inputs.product_id }}
        run: |
          set -euo pipefail
          [ -n "$CRON_SECRET" ] || { echo "CRON_SECRET is missing"; exit 1; }
          [[ "$COMPANY_ID" == biz_* ]] || { echo "Invalid Whop company ID"; exit 1; }
          [[ "$PRODUCT_ID" == prod_* ]] || { echo "Invalid Whop product ID"; exit 1; }
          jq -n \
            --arg capperEmail "$CAPPER_EMAIL" \
            --arg companyId "$COMPANY_ID" \
            --arg productId "$PRODUCT_ID" \
            '{capperEmail:$capperEmail,companyId:$companyId,productId:$productId}' \
            > /tmp/whop-e2e.json
          HTTP=$(curl -sS --max-time 300 -o /tmp/whop-e2e-result.json -w "%{http_code}" \
            -X POST "https://www.sportscappersleaderboard.com/api/admin/verify-whop-sync" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/whop-e2e.json)
          cat /tmp/whop-e2e-result.json
          echo
          [ "$HTTP" = "200" ] || { echo "Verification endpoint returned HTTP $HTTP"; exit 1; }
