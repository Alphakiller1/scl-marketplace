name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Dummy values so Prisma/Next can build without a real database.
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/postgres?schema=scl"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/postgres?schema=scl"
      AUTH_SECRET: "ci-placeholder-secret-not-used-at-build"
      AUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prettier check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  marketplace-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=scl"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=scl"
      AUTH_SECRET: "ci-placeholder-secret-not-used-at-build"
      AUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations to isolated PostgreSQL
        run: npm run db:deploy

      - name: Run Milestone 3 marketplace smoke
        run: npx tsx scripts/smoke-m3-marketplace.ts
