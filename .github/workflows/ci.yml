name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Dummy values so Prisma/Next can build without a real database.
    env:
      DATABASE_URL: "postgresql://user:pass@localhost:5432/postgres?schema=scl"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/postgres?schema=scl"
      AUTH_SECRET: "ci-placeholder-secret-not-used-at-build"
      AUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prettier check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
