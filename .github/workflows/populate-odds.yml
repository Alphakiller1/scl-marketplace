name: Populate odds

# Manual population plus a free daily audit. The paid CADENCE lives in
# `vercel.json` — see docs/ODDS_API_SCHEDULE.md.
#
# This file used to carry `0 12` and `0 0` schedules of its own, hitting the
# same endpoint that `vercel.json` already hit at those minutes. Both spent
# credits, so every scheduled surface refresh was billed twice for one board.
# Vercel owns the schedule now: it runs inside the deployment that holds the
# provider keys, and it fires on time (a GitHub schedule for `0 0` was landing
# at 00:50).
#
# What is left here:
#   - `audit` — a scheduled, ZERO-CREDIT read of the cached board, so a frozen
#     board is visible in Actions rather than only in the site's odds.
#   - `populate` / `populate-temp-key` — manual runs, on demand.
#   - `write-snapshots` — replays an already-fetched slate into the database.

on:
  schedule:
    # 13:00 UTC / 09:00 ET — two hours after the first paid populate of the day,
    # which is long enough that a board still stale at this point is a fault and
    # not a run in flight.
    - cron: "0 13 * * *"
  repository_dispatch:
    types: [populate-odds]
  workflow_dispatch:
    inputs:
      odds_key:
        description: "DO NOT USE — a key typed here is printed in this public run log. Set the ODDS_API_KEY_TEMP secret instead. Kept only so a run that passes one is refused rather than silently leaking it."
        required: false
        type: string
      use_temp_key:
        description: "Populate with the ODDS_API_KEY_TEMP secret instead of the keys on Vercel"
        required: false
        default: false
        type: boolean
      sports:
        description: "Comma-separated SCL sports, or blank for all"
        required: false
        default: "MLB,WNBA,TENNIS,SOCCER,NFL"
        type: string
      expanded:
        description: "Max events to expand per MLB/WNBA/Tennis sport"
        required: false
        default: "99"
        type: string
      expanded_days:
        description: "ET slate days for expanded MLB/WNBA: today,tomorrow"
        required: false
        default: "today"
        type: string
      budget_floor:
        description: "Stop spending once remaining credits hit this (temp-key runs)"
        required: false
        default: "20"
        type: string
      surface:
        description: "Refresh surface boards before expanding"
        required: false
        default: true
        type: boolean
      snapshot_file:
        description: "Replay an already-fetched snapshot file into the DB (no Odds API credits). Path under data/odds-snapshots/."
        required: false
        default: ""
        type: string
      snapshot_kinds:
        description: "Which snapshot kinds to replay: board, event-board, or both"
        required: false
        default: "board,event-board"
        type: string

concurrency:
  group: populate-odds
  cancel-in-progress: false

jobs:
  # Reads the cached board and spends nothing: `surface=0&expanded=0` makes the
  # route answer from `scl.OddsCacheSnapshot` without calling the provider.
  #
  # This job exists because the failure it looks for was invisible for a day.
  # The production key hit zero credits, every surface refresh fell back to
  # last-good data, and the scheduled job reported success on all five sports
  # because the CACHE still held events. Nothing distinguished "refreshed" from
  # "replayed yesterday" until someone opened the board.
  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - name: Read the cached board
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not configured."
            exit 1
          fi
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CRON_SECRET" \
            --request POST \
            "https://sportscappersleaderboard.com/api/cron/odds-populate?sports=MLB,WNBA,TENNIS,SOCCER,NFL&expanded=0&surface=0" \
            --output /tmp/audit.json
          jq . /tmp/audit.json

          # Credits first: an exhausted key freezes the board whatever the
          # cadence says, and it is the one fault no code change can clear.
          if [ "$(jq -r '.provider.exhausted' /tmp/audit.json)" = "true" ]; then
            echo "::error::The Odds API key on Vercel is out of credits. The board is frozen on last-good prices until ODDS_API_KEYS is topped up."
            exit 1
          fi

          stale=$(jq -r '.provider.staleSports | join(", ")' /tmp/audit.json)
          if [ -n "$stale" ]; then
            echo "::error::Boards older than the 4-hour freshness window: ${stale}. The paid cadence in vercel.json is not landing."
            exit 1
          fi
      - name: Summary
        if: always()
        run: |
          {
            echo "### Odds board audit (no credits spent)"
            echo '```json'
            jq . /tmp/audit.json 2>/dev/null || echo '{"reason":"request did not complete"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Replay a slate that was already paid for. Fetching and writing are separate
  # jobs because they need different things: fetching needs Odds API credits,
  # writing needs the production database. A run that has one and not the other
  # used to strand the slate — credits spent, nothing on the board.
  write-snapshots:
    if: github.event_name == 'workflow_dispatch' && inputs.snapshot_file != ''
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Neither source works today, and this step exists to say so precisely
      # rather than to write somewhere wrong:
      #   - the repository DATABASE_URL secret names a DIFFERENT Supabase
      #     project than the app runs on
      #   - the Vercel production DATABASE_URL is marked sensitive, so
      #     `vercel pull` writes an 11-character placeholder, not a connection
      #     string
      # Fix either one and this job starts working; until then surface
      # refreshes go through the signed production route below, which runs
      # inside Vercel where the real connection exists. The script re-checks
      # the database it lands on before it writes anything.
      - name: Resolve DATABASE_URL
        env:
          FALLBACK_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -uo pipefail
          if [ -n "${VERCEL_TOKEN:-}" ] && [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            npm install -g vercel@latest >/dev/null
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null
            for f in .vercel/.env.production.local .env.production.local .env; do
              if [ -f "$f" ]; then FILE="$f"; break; fi
            done
            if [ -n "${FILE:-}" ]; then
              FILE="$FILE" node scripts/emit-database-url.mjs
              echo "Resolved DATABASE_URL from the Vercel production environment." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          if [ -n "${FALLBACK_DATABASE_URL:-}" ]; then
            echo "DATABASE_URL=$FALLBACK_DATABASE_URL" >> "$GITHUB_ENV"
            echo "Resolved DATABASE_URL from the Production environment secret." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::No Vercel CLI secrets and no DATABASE_URL secret."
          exit 1

      - name: Write snapshots
        env:
          SNAPSHOT_FILE: data/odds-snapshots/${{ inputs.snapshot_file }}
          KINDS: ${{ inputs.snapshot_kinds }}
        run: |
          # pipefail, or `tee` reports success for a script that threw — which
          # is exactly how the first replay run went green having written
          # nothing at all.
          set -o pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL was not resolved."
            exit 1
          fi
          if [ ! -f "$SNAPSHOT_FILE" ]; then
            echo "::error::$SNAPSHOT_FILE does not exist on this ref."
            exit 1
          fi
          npx tsx scripts/write-odds-snapshots.ts | tee /tmp/write.log
      - name: Summary
        if: always()
        run: |
          {
            echo "### Odds snapshot replay"
            echo '```'
            cat /tmp/write.log 2>/dev/null || echo "the run did not complete"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  populate-temp-key:
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && (inputs.use_temp_key || inputs.odds_key != ''))
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      # The key comes from a SECRET, never from a dispatch input.
      #
      # Actions masks `secrets.*` everywhere and masks nothing else. A dispatch
      # input has to be registered with an add-mask command, and registering it is
      # what leaked it: the runner echoes each `run:` body with its expressions
      # already expanded, and it does that BEFORE the step executes — so the
      # masking command printed the key it was about to hide. Moving the value
      # into `env:` does not help, since the runner prints the resolved env
      # block too. There is no ordering that makes an input safe here, and this
      # repository is public.
      #
      # Rotate the key at the-odds-api.com and store it as ODDS_API_KEY_TEMP in
      # the Production environment. Better still, add it to ODDS_API_KEYS on
      # Vercel: `oddsApiKeys()` reads that comma-separated list, so a key parked
      # there is picked up by the scheduled cadence with no dispatch at all.
      - name: Check the key is configured
        env:
          ODDS_KEY: ${{ secrets.ODDS_API_KEY_TEMP }}
          # One expression, defaulted, so a repository_dispatch (where
          # `github.event.inputs` is null) does not read as "an input was
          # supplied" and refuse every dispatch.
          SUPPLIED_INPUT: ${{ (github.event.client_payload.odds_key || github.event.inputs.odds_key || '') != '' }}
        run: |
          if [ "$SUPPLIED_INPUT" = "true" ]; then
            echo "::error::An Odds API key was passed as a dispatch input. Inputs are printed in this public run log, so the run was stopped and no credits were spent. Rotate that key and store the new one as the ODDS_API_KEY_TEMP secret."
            exit 1
          fi
          if [ -z "$ODDS_KEY" ]; then
            echo "::error::ODDS_API_KEY_TEMP is not configured in the Production environment. No odds credits were spent."
            exit 1
          fi

      - name: Populate through the signed production route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ODDS_KEY: ${{ secrets.ODDS_API_KEY_TEMP }}
          SPORTS: ${{ github.event.client_payload.sports || github.event.inputs.sports || 'MLB,WNBA,TENNIS,SOCCER,NFL' }}
          EXPANDED: ${{ github.event.client_payload.expanded || github.event.inputs.expanded || '99' }}
          EXPANDED_DAYS: ${{ github.event.client_payload.expanded_days || github.event.inputs.expanded_days || 'today' }}
          SURFACE: ${{ github.event.client_payload.surface || '1' }}
          SKIP_POPULATED: ${{ github.event.client_payload.skipPopulated || '1' }}
          EXPANDED_ORDER: ${{ github.event.client_payload.expandedOrder || 'MLB,WNBA,TENNIS,SOCCER' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not configured. No odds credits were spent."
            exit 1
          fi
          if [ -z "$ODDS_KEY" ]; then
            echo "::error::Temporary Odds API key is missing. No odds credits were spent."
            exit 1
          fi
          encoded_sports=$(jq -rn --arg value "$SPORTS" '$value|@uri')
          encoded_days=$(jq -rn --arg value "$EXPANDED_DAYS" '$value|@uri')
          encoded_order=$(jq -rn --arg value "$EXPANDED_ORDER" '$value|@uri')
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "x-scl-odds-key: $ODDS_KEY" \
            --request POST \
            "https://sportscappersleaderboard.com/api/cron/odds-populate?sports=${encoded_sports}&expanded=${EXPANDED}&expandedDays=${encoded_days}&surface=${SURFACE}&skipPopulated=${SKIP_POPULATED}&expandedOrder=${encoded_order}" \
            --output /tmp/populate.json
          jq . /tmp/populate.json
          # Match the route: only require a sport's surface when that sport was requested.
          # A WNBA-only top-up writes boards and returns ok, but the old MLB+WNBA
          # gate marked the job failed after today's slate fill.
          jq -e '
            .ok == true
            and ((.sports | index("MLB") | not) or (.surface.MLB.events // 0) > 0)
            and ((.sports | index("WNBA") | not) or (.surface.WNBA.events // 0) > 0)
            and ((.sports | index("TENNIS") | not) or (.surface.TENNIS.events // 0) > 0)
            and ((.sports | index("SOCCER") | not) or (.surface.SOCCER.events // 0) > 0)
            and ((.sports | index("NFL") | not) or (.surface.NFL.events // 0) > 0)
          ' /tmp/populate.json >/dev/null

      - name: Summary
        if: always()
        run: |
          {
            echo "### Odds population (temporary key)"
            echo '```json'
            jq . /tmp/populate.json 2>/dev/null || echo '{"ok":false,"reason":"request did not complete"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Manual only. The daily cadence is Vercel's; this is the on-demand button for
  # an off-schedule top-up using the keys already on the deployment.
  populate:
    if: github.event_name == 'workflow_dispatch' && !inputs.use_temp_key && inputs.odds_key == '' && inputs.snapshot_file == ''
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Populate through the signed production route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SPORTS: ${{ inputs.sports || 'MLB,WNBA,TENNIS,SOCCER,NFL' }}
          EXPANDED: ${{ inputs.expanded }}
          EXPANDED_DAYS: ${{ inputs.expanded_days || 'tomorrow' }}
          SURFACE: ${{ inputs.surface && '1' || '0' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not configured. No odds credits were spent."
            exit 1
          fi
          encoded_sports=$(jq -rn --arg value "$SPORTS" '$value|@uri')
          encoded_days=$(jq -rn --arg value "$EXPANDED_DAYS" '$value|@uri')
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CRON_SECRET" \
            --request POST \
            "https://sportscappersleaderboard.com/api/cron/odds-populate?sports=${encoded_sports}&expanded=${EXPANDED}&expandedDays=${encoded_days}&surface=${SURFACE}" \
            --output /tmp/populate.json
          jq . /tmp/populate.json
          jq -e '
            .ok == true
            and ((.sports | index("MLB") | not) or (.surface.MLB.events // 0) > 0)
            and ((.sports | index("WNBA") | not) or (.surface.WNBA.events // 0) > 0)
            and ((.sports | index("TENNIS") | not) or (.surface.TENNIS.events // 0) > 0)
            and ((.sports | index("SOCCER") | not) or (.surface.SOCCER.events // 0) > 0)
            and ((.sports | index("NFL") | not) or (.surface.NFL.events // 0) > 0)
          ' /tmp/populate.json >/dev/null

      - name: Summary
        if: always()
        run: |
          {
            echo "### Odds population"
            echo '```json'
            jq . /tmp/populate.json 2>/dev/null || echo '{"ok":false,"reason":"request did not complete"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
