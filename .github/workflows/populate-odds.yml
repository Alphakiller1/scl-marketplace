name: Populate odds

# Two daily scheduled runs refresh surface prices through the signed production
# route (the keys already on Vercel). One-shot populate sends a temporary Odds
# API key to that same route — used for that job only, never stored — so Vercel
# writes scl.OddsCacheSnapshot with the database it already holds.

on:
  schedule:
    - cron: "0 12 * * *" # 08:00 ET (during daylight time)
    - cron: "0 0 * * *" # 20:00 ET (during daylight time)
  repository_dispatch:
    types: [populate-odds]
  workflow_dispatch:
    inputs:
      odds_key:
        description: "Temporary Odds API key for this run only. Leave blank to use production keys."
        required: false
        type: string
      sports:
        description: "Comma-separated SCL sports, or blank for all"
        required: false
        default: "MLB,WNBA,TENNIS,SOCCER,NFL"
        type: string
      expanded:
        description: "Max events to expand per MLB/WNBA/Tennis sport"
        required: false
        default: "99"
        type: string
      expanded_days:
        description: "ET slate days for expanded MLB/WNBA: today,tomorrow"
        required: false
        default: "today"
        type: string
      budget_floor:
        description: "Stop spending once remaining credits hit this (temp-key runs)"
        required: false
        default: "20"
        type: string
      markets:
        description: "Top up only these event markets (e.g. alternate_team_totals) instead of the full expanded board. One credit per market per event."
        required: false
        default: ""
        type: string
      surface:
        description: "Refresh surface boards before expanding"
        required: false
        default: true
        type: boolean

concurrency:
  group: populate-odds
  cancel-in-progress: false

jobs:
  populate-temp-key:
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.odds_key != '' && inputs.markets == '')
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      # Through env, not interpolated into the command: the runner echoes every
      # command it runs, so an inlined key is printed in full BEFORE the mask
      # that is meant to hide it exists.
      - name: Mask the key
        env:
          ODDS_KEY: ${{ github.event.client_payload.odds_key || github.event.inputs.odds_key }}
        run: echo "::add-mask::$ODDS_KEY"

      - name: Populate through the signed production route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ODDS_KEY: ${{ github.event.client_payload.odds_key || github.event.inputs.odds_key }}
          SPORTS: ${{ github.event.client_payload.sports || github.event.inputs.sports || 'MLB,WNBA,TENNIS,SOCCER,NFL' }}
          EXPANDED: ${{ github.event.client_payload.expanded || github.event.inputs.expanded || '99' }}
          EXPANDED_DAYS: ${{ github.event.client_payload.expanded_days || github.event.inputs.expanded_days || 'today' }}
          SURFACE: ${{ github.event.client_payload.surface || '1' }}
          SKIP_POPULATED: ${{ github.event.client_payload.skipPopulated || '1' }}
          EXPANDED_ORDER: ${{ github.event.client_payload.expandedOrder || 'MLB,WNBA,TENNIS' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not configured. No odds credits were spent."
            exit 1
          fi
          if [ -z "$ODDS_KEY" ]; then
            echo "::error::Temporary Odds API key is missing. No odds credits were spent."
            exit 1
          fi
          encoded_sports=$(jq -rn --arg value "$SPORTS" '$value|@uri')
          encoded_days=$(jq -rn --arg value "$EXPANDED_DAYS" '$value|@uri')
          encoded_order=$(jq -rn --arg value "$EXPANDED_ORDER" '$value|@uri')
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "x-scl-odds-key: $ODDS_KEY" \
            --request POST \
            "https://sportscappersleaderboard.com/api/cron/odds-populate?sports=${encoded_sports}&expanded=${EXPANDED}&expandedDays=${encoded_days}&surface=${SURFACE}&skipPopulated=${SKIP_POPULATED}&expandedOrder=${encoded_order}" \
            --output /tmp/populate.json
          jq . /tmp/populate.json
          # Match the route: only require a sport's surface when that sport was requested.
          # A WNBA-only top-up writes boards and returns ok, but the old MLB+WNBA
          # gate marked the job failed after today's slate fill.
          jq -e '
            .ok == true
            and ((.sports | index("MLB") | not) or (.surface.MLB.events // 0) > 0)
            and ((.sports | index("WNBA") | not) or (.surface.WNBA.events // 0) > 0)
            and ((.sports | index("TENNIS") | not) or (.surface.TENNIS.events // 0) > 0)
            and ((.sports | index("SOCCER") | not) or (.surface.SOCCER.events // 0) > 0)
            and ((.sports | index("NFL") | not) or (.surface.NFL.events // 0) > 0)
          ' /tmp/populate.json >/dev/null

      - name: Summary
        if: always()
        run: |
          {
            echo "### Odds population (temporary key)"
            echo '```json'
            jq . /tmp/populate.json 2>/dev/null || echo '{"ok":false,"reason":"request did not complete"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A market top-up, not a board rebuild. Books post the alternate ladders
  # (team totals especially) only a few hours before first pitch, so the
  # overnight populate writes a board whose featured lines are complete and
  # whose ladders are simply not published yet. Re-running the whole expanded
  # board to collect them costs 44 credits an event; asking for the one market
  # costs 1, which is the difference between affordable and not on a key that
  # has already paid for the slate. Writes through the script rather than the
  # signed route because the route has no market override — and because the
  # script merges into the stored board, so the top-up adds rows instead of
  # replacing 590 of them.
  top-up-markets:
    if: github.event_name == 'workflow_dispatch' && inputs.markets != '' && inputs.odds_key != ''
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    steps:
      - name: Mask the key
        env:
          ODDS_KEY: ${{ inputs.odds_key }}
        run: echo "::add-mask::$ODDS_KEY"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Before the first billed call: a run that cannot write is a run that
      # spends the key and throws the answer away.
      - name: Resolve DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::No DATABASE_URL in the Production environment. No odds credits were spent."
            exit 1
          fi
          {
            echo "DATABASE_URL=$DATABASE_URL"
            [ -n "$DIRECT_URL" ] && echo "DIRECT_URL=$DIRECT_URL"
          } >> "$GITHUB_ENV"

      - name: Top up the requested markets
        env:
          ODDS_KEY: ${{ inputs.odds_key }}
          WRITE_DB: "1"
          MARKETS: ${{ inputs.markets }}
          SPORTS: ${{ inputs.sports }}
          EXPANDED: ${{ inputs.expanded }}
          EXPANDED_DAYS: ${{ inputs.expanded_days }}
          BUDGET_FLOOR: ${{ inputs.budget_floor }}
          # A top-up never rewrites surface boards: it reads the slate from the
          # free /events endpoint so every credit goes to the market asked for.
          SURFACE: "0"
        run: npx tsx scripts/populate-odds-today.ts | tee /tmp/topup.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Odds market top-up (${{ inputs.markets }})"
            echo '```'
            tail -40 /tmp/topup.log 2>/dev/null || echo "run did not complete"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  populate:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.odds_key == '' && inputs.markets == '')
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Populate through the signed production route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SPORTS: ${{ inputs.sports || 'MLB,WNBA,TENNIS,SOCCER,NFL' }}
          EXPANDED: ${{ github.event_name == 'schedule' && '0' || inputs.expanded }}
          EXPANDED_DAYS: ${{ inputs.expanded_days || 'tomorrow' }}
          SURFACE: ${{ github.event_name == 'schedule' && '1' || (inputs.surface && '1' || '0') }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not configured. No odds credits were spent."
            exit 1
          fi
          encoded_sports=$(jq -rn --arg value "$SPORTS" '$value|@uri')
          encoded_days=$(jq -rn --arg value "$EXPANDED_DAYS" '$value|@uri')
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CRON_SECRET" \
            --request POST \
            "https://sportscappersleaderboard.com/api/cron/odds-populate?sports=${encoded_sports}&expanded=${EXPANDED}&expandedDays=${encoded_days}&surface=${SURFACE}" \
            --output /tmp/populate.json
          jq . /tmp/populate.json
          jq -e '
            .ok == true
            and ((.sports | index("MLB") | not) or (.surface.MLB.events // 0) > 0)
            and ((.sports | index("WNBA") | not) or (.surface.WNBA.events // 0) > 0)
            and ((.sports | index("TENNIS") | not) or (.surface.TENNIS.events // 0) > 0)
            and ((.sports | index("SOCCER") | not) or (.surface.SOCCER.events // 0) > 0)
            and ((.sports | index("NFL") | not) or (.surface.NFL.events // 0) > 0)
          ' /tmp/populate.json >/dev/null

      - name: Summary
        if: always()
        run: |
          {
            echo "### Odds population"
            echo '```json'
            jq . /tmp/populate.json 2>/dev/null || echo '{"ok":false,"reason":"request did not complete"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
