name: Populate odds

# The manual warm expands tomorrow's MLB/WNBA event boards. Exactly two daily
# scheduled runs refresh surface prices only; expanded event boards remain in
# the 30-day last-good cache if either scheduled refresh or the provider fails.

on:
  schedule:
    - cron: "0 12 * * *" # 08:00 ET (during daylight time)
    - cron: "0 0 * * *" # 20:00 ET (during daylight time)
  workflow_dispatch:
    inputs:
      sports:
        description: "Comma-separated SCL sports, or blank for all"
        required: false
        default: "MLB,WNBA,NFL,TENNIS,SOCCER"
        type: string
      expanded:
        description: "Max tomorrow events to expand per MLB/WNBA sport"
        required: false
        default: "99"
        type: string
      expanded_days:
        description: "ET slate days for expanded MLB/WNBA: today,tomorrow"
        required: false
        default: "tomorrow"
        type: string

concurrency:
  group: populate-odds
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Populate through the signed production route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SPORTS: ${{ inputs.sports || 'MLB,WNBA,NFL,TENNIS,SOCCER' }}
          EXPANDED: ${{ github.event_name == 'schedule' && '0' || inputs.expanded }}
          EXPANDED_DAYS: ${{ inputs.expanded_days || 'tomorrow' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not configured. No odds credits were spent."
            exit 1
          fi
          encoded_sports=$(jq -rn --arg value "$SPORTS" '$value|@uri')
          encoded_days=$(jq -rn --arg value "$EXPANDED_DAYS" '$value|@uri')
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CRON_SECRET" \
            --request POST \
            "https://sportscappersleaderboard.com/api/cron/odds-populate?sports=${encoded_sports}&expanded=${EXPANDED}&expandedDays=${encoded_days}" \
            --output /tmp/populate.json
          jq . /tmp/populate.json
          jq -e '.ok == true and .surface.MLB.events > 0 and .surface.WNBA.events > 0' /tmp/populate.json >/dev/null

      - name: Summary
        if: always()
        run: |
          {
            echo "### Odds population"
            echo '```json'
            jq . /tmp/populate.json 2>/dev/null || echo '{"ok":false,"reason":"request did not complete"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
