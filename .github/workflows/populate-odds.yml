name: Populate odds

# One explicit full warm plus two daily surface-price refreshes. Expanded MLB
# and WNBA event boards are durable last-good snapshots and are not erased by
# later provider failures or by the two surface-only scheduled runs.
#
# The protected Production environment supplies the Odds API key. Boards are
# written straight to the production database because the GitHub runner can
# reach the Supabase host that is unavailable from some local IPv4 networks.

on:
  schedule:
    - cron: "0 12 * * *" # 08:00 ET (during daylight time)
    - cron: "0 0 * * *" # 20:00 ET (during daylight time)
  workflow_dispatch:
    inputs:
      sports:
        description: "Comma-separated SCL sports, or blank for all"
        required: false
        default: ""
        type: string
      expanded:
        description: "Max events to expand per sport (alt lines, team totals, props)"
        required: false
        default: "99"
        type: string
      budget_floor:
        description: "Stop spending once remaining credits hit this"
        required: false
        default: "120"
        type: string
      expanded_days:
        description: "ET slate days for expanded MLB/WNBA: today,tomorrow"
        required: false
        default: "tomorrow"
        type: string

concurrency:
  group: populate-odds
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    steps:
      - name: Validate protected odds key
        env:
          ODDS_KEY: ${{ secrets.ODDS_API_KEY }}
        run: test -n "$ODDS_KEY"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # Resolve the production pooler before spending a single odds credit. The
      # Supabase direct host is IPv6-only; GitHub-hosted runners need the IPv4
      # transaction pooler. The password never leaves the protected secret.
      - name: Resolve and verify the writable database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — cannot write the board."
            exit 1
          fi

          writable_url="$DATABASE_URL"
          if ! echo "select 1;" | npx prisma db execute --stdin --url "$writable_url" >/tmp/db-probe.log 2>&1; then
            node -e '
              const { writeFileSync } = require("node:fs");
              const url = new URL(process.env.DATABASE_URL);
              const match = /^db\.([a-z0-9]+)\.supabase\.co$/i.exec(url.hostname);
              if (!match) process.exit(2);
              const candidates = [];
              for (const region of ["us-west-2", "us-west-1", "us-east-1", "us-east-2"]) {
                for (const tenant of [0, 1]) {
                  for (const port of [5432, 6543]) {
                    const candidate = new URL(url);
                    candidate.hostname = `aws-${tenant}-${region}.pooler.supabase.com`;
                    candidate.port = String(port);
                    candidate.username = `postgres.${match[1]}`;
                    candidate.searchParams.set("pgbouncer", "true");
                    candidates.push(candidate.toString());
                  }
                }
              }
              writeFileSync("/tmp/scl-db-candidates", candidates.join("\n"), { mode: 0o600 });
            ' || true
            if [ ! -s /tmp/scl-db-candidates ]; then
              echo "::error::DATABASE_URL is unreachable and is not a recognized Supabase direct URL. No odds credits were spent."
              exit 1
            fi

            writable_url=""
            while IFS= read -r candidate; do
              echo "::add-mask::$candidate"
              if echo "select 1;" | timeout 12s npx prisma db execute --stdin --url "$candidate" >/tmp/db-pooler-probe.log 2>&1; then
                writable_url="$candidate"
                break
              fi
            done < /tmp/scl-db-candidates
            rm -f /tmp/scl-db-candidates

            if [ -z "$writable_url" ]; then
              echo "::error::The production Supabase pooler is unreachable. No odds credits were spent."
              exit 1
            fi
          fi

          {
            echo "DATABASE_URL<<SCL_DATABASE_URL"
            echo "$writable_url"
            echo "SCL_DATABASE_URL"
          } >> "$GITHUB_ENV"

      - name: Populate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ODDS_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTS: ${{ inputs.sports }}
          EXPANDED: ${{ github.event_name == 'schedule' && '0' || inputs.expanded }}
          EXPANDED_DAYS: ${{ inputs.expanded_days || 'tomorrow' }}
          BUDGET_FLOOR: ${{ github.event_name == 'schedule' && '100' || inputs.budget_floor }}
          WRITE_DB: "1"
        run: npx tsx scripts/populate-odds-today.ts | tee /tmp/populate.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Odds population"
            echo '```'
            tail -40 /tmp/populate.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
