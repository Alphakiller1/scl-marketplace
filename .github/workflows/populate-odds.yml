name: Populate odds

# One explicit full warm plus two daily surface-price refreshes. Expanded MLB
# and WNBA event boards are durable last-good snapshots and are not erased by
# later provider failures or by the two surface-only scheduled runs.
#
# The protected Production environment supplies the Odds API key. Boards are
# written straight to the production database because the GitHub runner can
# reach the Supabase host that is unavailable from some local IPv4 networks.

on:
  schedule:
    - cron: "0 12 * * *" # 08:00 ET (during daylight time)
    - cron: "0 0 * * *" # 20:00 ET (during daylight time)
  workflow_dispatch:
    inputs:
      sports:
        description: "Comma-separated SCL sports, or blank for all"
        required: false
        default: ""
        type: string
      expanded:
        description: "Max events to expand per sport (alt lines, team totals, props)"
        required: false
        default: "99"
        type: string
      budget_floor:
        description: "Stop spending once remaining credits hit this"
        required: false
        default: "120"
        type: string
      expanded_days:
        description: "ET slate days for expanded MLB/WNBA: today,tomorrow"
        required: false
        default: "tomorrow"
        type: string

concurrency:
  group: populate-odds
  cancel-in-progress: false

jobs:
  populate:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    steps:
      - name: Validate protected odds key
        env:
          ODDS_KEY: ${{ secrets.ODDS_API_KEY }}
        run: test -n "$ODDS_KEY"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # BEFORE spending a single credit. The first run of this workflow fetched
      # the whole expanded MLB slate, then failed to write it because the
      # DATABASE_URL secret points at a different Supabase project on an
      # IPv6-only host the runner cannot reach. 151 credits bought nothing.
      # A connectivity probe is free; the fetch is not, so it goes first.
      - name: Verify the database is writable
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — cannot write the board."
            exit 1
          fi
          echo "select 1;" | npx prisma db execute --stdin --url "$DATABASE_URL" || {
            host=$(printf '%s' "$DATABASE_URL" | sed -E 's#.*@([^:/?]+).*#\1#')
            echo "::error::Cannot reach the database at ${host}. The board was NOT fetched, so no credits were spent. Point the DATABASE_URL secret at the production pooler host."
            exit 1
          }

      - name: Populate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ODDS_KEY: ${{ secrets.ODDS_API_KEY }}
          SPORTS: ${{ inputs.sports }}
          EXPANDED: ${{ github.event_name == 'schedule' && '0' || inputs.expanded }}
          EXPANDED_DAYS: ${{ inputs.expanded_days || 'tomorrow' }}
          BUDGET_FLOOR: ${{ github.event_name == 'schedule' && '100' || inputs.budget_floor }}
          WRITE_DB: "1"
        run: npx tsx scripts/populate-odds-today.ts | tee /tmp/populate.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Odds population"
            echo '```'
            tail -40 /tmp/populate.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
