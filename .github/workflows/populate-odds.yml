name: Populate odds

# Two daily scheduled runs refresh surface prices through the signed production
# route (the keys already on Vercel). One-shot populate uses a temporary Odds
# API key from workflow_dispatch or repository_dispatch (populate-odds) — used
# for that job only, never stored as an env var — and writes boards with the
# Production DATABASE_URL, the same flow as #514.

on:
  schedule:
    - cron: "0 12 * * *" # 08:00 ET (during daylight time)
    - cron: "0 0 * * *" # 20:00 ET (during daylight time)
  repository_dispatch:
    types: [populate-odds]
  workflow_dispatch:
    inputs:
      odds_key:
        description: "Temporary Odds API key for this run only. Leave blank to use production keys."
        required: false
        type: string
      sports:
        description: "Comma-separated SCL sports, or blank for all"
        required: false
        default: "MLB,WNBA,NFL,TENNIS,SOCCER"
        type: string
      expanded:
        description: "Max events to expand per MLB/WNBA sport"
        required: false
        default: "99"
        type: string
      expanded_days:
        description: "ET slate days for expanded MLB/WNBA: today,tomorrow"
        required: false
        default: "today"
        type: string
      budget_floor:
        description: "Stop spending once remaining credits hit this (temp-key runs)"
        required: false
        default: "20"
        type: string
      surface:
        description: "Refresh surface boards before expanding"
        required: false
        default: true
        type: boolean

concurrency:
  group: populate-odds
  cancel-in-progress: false

jobs:
  populate-temp-key:
    if: github.event_name == 'repository_dispatch' || (github.event_name == 'workflow_dispatch' && inputs.odds_key != '')
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    steps:
      - name: Mask the key
        run: echo "::add-mask::${{ github.event.client_payload.odds_key || github.event.inputs.odds_key }}"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      # GitHub's DATABASE_URL secret points at db.*.supabase.co:5432 (IPv6-only).
      # The live site uses the Vercel Production pooler. Load that first and
      # probe before spending any Odds API credits.
      - name: Load the writable production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          writable_url=""

          if [ -n "${VERCEL_TOKEN:-}" ] && [ -n "${VERCEL_ORG_ID:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            if curl --fail --silent --show-error --get \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --data-urlencode "decrypt=true" \
              --data-urlencode "source=vercel-cli:pull" \
              --data-urlencode "teamId=$VERCEL_ORG_ID" \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env" \
              --output /tmp/scl-production-env.json; then
              node -e '
                const { readFileSync, writeFileSync } = require("node:fs");
                const body = JSON.parse(readFileSync("/tmp/scl-production-env.json", "utf8"));
                const rows = Array.isArray(body.envs) ? body.envs : [];
                const production = rows.filter((row) =>
                  Array.isArray(row.target) && row.target.includes("production"),
                );
                const preferred = ["DATABASE_URL", "POSTGRES_PRISMA_URL", "POSTGRES_URL"];
                const row = preferred
                  .map((key) => production.find((candidate) => candidate.key === key))
                  .find(Boolean);
                const raw = typeof row?.value === "string" ? row.value.trim() : "";
                if (!raw || raw === "[SENSITIVE]") process.exit(2);
                const url = new URL(raw);
                if (!url.searchParams.has("schema")) url.searchParams.set("schema", "scl");
                writeFileSync("/tmp/scl-production-db", url.toString(), { mode: 0o600 });
              ' && writable_url=$(cat /tmp/scl-production-db) || true
            fi
            rm -f /tmp/scl-production-env.json /tmp/scl-production-db
          fi

          if [ -z "$writable_url" ]; then
            writable_url="${DATABASE_URL:-}"
          fi
          if [ -z "$writable_url" ]; then
            echo "::error::No production database URL is available. No odds credits were spent."
            exit 1
          fi
          echo "::add-mask::$writable_url"

          if ! echo "select 1;" | npx prisma db execute --stdin --url "$writable_url" >/tmp/db-probe.log 2>&1; then
            node -e '
              const { writeFileSync } = require("node:fs");
              const url = new URL(process.argv[1]);
              const match = /^db\.([a-z0-9]+)\.supabase\.co$/i.exec(url.hostname);
              if (!match) process.exit(2);
              const candidates = [];
              for (const region of ["us-west-2", "us-west-1", "us-east-1", "us-east-2"]) {
                for (const tenant of [0, 1]) {
                  for (const port of [5432, 6543]) {
                    const candidate = new URL(url);
                    candidate.hostname = `aws-${tenant}-${region}.pooler.supabase.com`;
                    candidate.port = String(port);
                    candidate.username = `postgres.${match[1]}`;
                    candidate.searchParams.set("pgbouncer", "true");
                    candidates.push(candidate.toString());
                  }
                }
              }
              writeFileSync("/tmp/scl-db-candidates", candidates.join("\n"), { mode: 0o600 });
            ' "$writable_url" || true
            if [ ! -s /tmp/scl-db-candidates ]; then
              echo "::error::Production database is unreachable. No odds credits were spent."
              cat /tmp/db-probe.log || true
              exit 1
            fi
            writable_url=""
            while IFS= read -r candidate; do
              echo "::add-mask::$candidate"
              if echo "select 1;" | timeout 12s npx prisma db execute --stdin --url "$candidate" >/tmp/db-pooler-probe.log 2>&1; then
                writable_url="$candidate"
                break
              fi
            done < /tmp/scl-db-candidates
            rm -f /tmp/scl-db-candidates
            if [ -z "$writable_url" ]; then
              echo "::error::The production Supabase pooler is unreachable. No odds credits were spent."
              exit 1
            fi
          fi

          {
            echo "DATABASE_URL<<SCL_DATABASE_URL"
            echo "$writable_url"
            echo "SCL_DATABASE_URL"
          } >> "$GITHUB_ENV"

      - name: Populate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ODDS_KEY: ${{ github.event.client_payload.odds_key || github.event.inputs.odds_key }}
          SPORTS: ${{ github.event.client_payload.sports || github.event.inputs.sports || 'MLB,WNBA,NFL,TENNIS,SOCCER' }}
          EXPANDED: ${{ github.event.client_payload.expanded || github.event.inputs.expanded || '99' }}
          EXPANDED_DAYS: ${{ github.event.client_payload.expanded_days || github.event.inputs.expanded_days || 'today' }}
          BUDGET_FLOOR: ${{ github.event.client_payload.budget_floor || github.event.inputs.budget_floor || '20' }}
          WRITE_DB: "1"
        run: npx tsx scripts/populate-odds-today.ts | tee /tmp/populate.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Odds population (temporary key)"
            echo '```'
            tail -80 /tmp/populate.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  populate:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.odds_key == '')
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Populate through the signed production route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SPORTS: ${{ inputs.sports || 'MLB,WNBA,NFL,TENNIS,SOCCER' }}
          EXPANDED: ${{ github.event_name == 'schedule' && '0' || inputs.expanded }}
          EXPANDED_DAYS: ${{ inputs.expanded_days || 'tomorrow' }}
          SURFACE: ${{ github.event_name == 'schedule' && '1' || (inputs.surface && '1' || '0') }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not configured. No odds credits were spent."
            exit 1
          fi
          encoded_sports=$(jq -rn --arg value "$SPORTS" '$value|@uri')
          encoded_days=$(jq -rn --arg value "$EXPANDED_DAYS" '$value|@uri')
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CRON_SECRET" \
            --request POST \
            "https://sportscappersleaderboard.com/api/cron/odds-populate?sports=${encoded_sports}&expanded=${EXPANDED}&expandedDays=${encoded_days}&surface=${SURFACE}" \
            --output /tmp/populate.json
          jq . /tmp/populate.json
          jq -e '.ok == true and .surface.MLB.events > 0 and .surface.WNBA.events > 0' /tmp/populate.json >/dev/null

      - name: Summary
        if: always()
        run: |
          {
            echo "### Odds population"
            echo '```json'
            jq . /tmp/populate.json 2>/dev/null || echo '{"ok":false,"reason":"request did not complete"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
