name: Populate odds

# Two daily scheduled runs refresh surface prices through the signed production
# route (the keys already on Vercel). Manual runs can paste a temporary Odds
# API key — used for that job only, never stored as an env var — and write
# boards with the Production DATABASE_URL, the same one-shot flow as #514.

on:
  schedule:
    - cron: "0 12 * * *" # 08:00 ET (during daylight time)
    - cron: "0 0 * * *" # 20:00 ET (during daylight time)
  workflow_dispatch:
    inputs:
      odds_key:
        description: "Temporary Odds API key for this run only. Leave blank to use production keys."
        required: false
        type: string
      sports:
        description: "Comma-separated SCL sports, or blank for all"
        required: false
        default: "MLB,WNBA,NFL,TENNIS,SOCCER"
        type: string
      expanded:
        description: "Max events to expand per MLB/WNBA sport"
        required: false
        default: "99"
        type: string
      expanded_days:
        description: "ET slate days for expanded MLB/WNBA: today,tomorrow"
        required: false
        default: "today"
        type: string
      budget_floor:
        description: "Stop spending once remaining credits hit this (temp-key runs)"
        required: false
        default: "20"
        type: string
      surface:
        description: "Refresh surface boards before expanding"
        required: false
        default: true
        type: boolean

concurrency:
  group: populate-odds
  cancel-in-progress: false

jobs:
  populate-temp-key:
    if: github.event_name == 'workflow_dispatch' && inputs.odds_key != ''
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    steps:
      - name: Mask the key
        run: echo "::add-mask::${{ inputs.odds_key }}"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Verify the database is writable
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set — cannot write the board."
            exit 1
          fi
          echo "select 1;" | npx prisma db execute --stdin --url "$DATABASE_URL" || {
            echo "::error::Cannot reach the production database. The board was NOT fetched, so no credits were spent."
            exit 1
          }

      - name: Populate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ODDS_KEY: ${{ inputs.odds_key }}
          SPORTS: ${{ inputs.sports }}
          EXPANDED: ${{ inputs.expanded }}
          EXPANDED_DAYS: ${{ inputs.expanded_days }}
          BUDGET_FLOOR: ${{ inputs.budget_floor }}
          WRITE_DB: "1"
        run: npx tsx scripts/populate-odds-today.ts | tee /tmp/populate.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### Odds population (temporary key)"
            echo '```'
            tail -80 /tmp/populate.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  populate:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.odds_key == '')
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    steps:
      - name: Populate through the signed production route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SPORTS: ${{ inputs.sports || 'MLB,WNBA,NFL,TENNIS,SOCCER' }}
          EXPANDED: ${{ github.event_name == 'schedule' && '0' || inputs.expanded }}
          EXPANDED_DAYS: ${{ inputs.expanded_days || 'tomorrow' }}
          SURFACE: ${{ github.event_name == 'schedule' && '1' || (inputs.surface && '1' || '0') }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not configured. No odds credits were spent."
            exit 1
          fi
          encoded_sports=$(jq -rn --arg value "$SPORTS" '$value|@uri')
          encoded_days=$(jq -rn --arg value "$EXPANDED_DAYS" '$value|@uri')
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CRON_SECRET" \
            --request POST \
            "https://sportscappersleaderboard.com/api/cron/odds-populate?sports=${encoded_sports}&expanded=${EXPANDED}&expandedDays=${encoded_days}&surface=${SURFACE}" \
            --output /tmp/populate.json
          jq . /tmp/populate.json
          jq -e '.ok == true and .surface.MLB.events > 0 and .surface.WNBA.events > 0' /tmp/populate.json >/dev/null

      - name: Summary
        if: always()
        run: |
          {
            echo "### Odds population"
            echo '```json'
            jq . /tmp/populate.json 2>/dev/null || echo '{"ok":false,"reason":"request did not complete"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
