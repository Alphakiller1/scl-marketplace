name: Sync odds key to Vercel

on:
  workflow_dispatch:
    inputs:
      redeploy:
        description: Trigger a production redeploy after syncing
        type: boolean
        default: true

concurrency:
  group: sync-odds-vercel-env
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Validate protected credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          missing=()
          [ -z "$VERCEL_TOKEN" ] && missing+=("VERCEL_TOKEN")
          [ -z "$VERCEL_ORG_ID" ] && missing+=("VERCEL_ORG_ID")
          [ -z "$VERCEL_PROJECT_ID" ] && missing+=("VERCEL_PROJECT_ID")
          [ -z "$ODDS_API_KEY" ] && missing+=("ODDS_API_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing Production environment secrets: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Upsert odds key on Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          npm install -g vercel@latest
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          vercel env rm ODDS_API_KEY production --yes --token="$VERCEL_TOKEN" 2>/dev/null || true
          printf '%s' "$ODDS_API_KEY" | vercel env add ODDS_API_KEY production --token="$VERCEL_TOKEN"
          echo "### Odds key synced to Vercel Production" >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger production redeploy
        if: inputs.redeploy
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "No deploy hook configured; the key is saved but requires a redeploy."
            exit 1
          fi
          HTTP=$(curl -sS -o /tmp/hook-body.txt -w "%{http_code}" -X POST "$VERCEL_DEPLOY_HOOK_URL")
          echo "Deploy hook HTTP $HTTP"
          if [ "$HTTP" -lt 200 ] || [ "$HTTP" -ge 300 ]; then
            exit 1
          fi
          echo "### Production redeploy triggered" >> "$GITHUB_STEP_SUMMARY"
