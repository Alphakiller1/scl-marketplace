name: Provision existing production owner (manual)

on:
  workflow_dispatch:
    inputs:
      owner_email:
        description: Existing verified user email to promote
        required: true
        type: string
      confirm:
        description: Type PROMOTE_EXISTING_OWNER to continue
        required: true
        type: string

jobs:
  provision:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm production promotion
        if: ${{ inputs.confirm != 'PROMOTE_EXISTING_OWNER' }}
        run: |
          echo "Confirmation did not match."
          exit 1

      - name: Promote existing owner account
        run: npx tsx scripts/ensure-owner-admin.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          VERCEL_ENV: production
          OWNER_ADMIN_EMAIL: ${{ inputs.owner_email }}
