name: Provision existing production owner (manual)

on:
  workflow_dispatch:
    inputs:
      owner_email:
        description: Existing verified user email to promote
        required: true
        type: string
      confirm:
        description: Type PROMOTE_EXISTING_OWNER to continue
        required: true
        type: string

jobs:
  provision:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm production promotion
        if: ${{ inputs.confirm != 'PROMOTE_EXISTING_OWNER' }}
        run: |
          echo "Confirmation did not match."
          exit 1

      - name: Use IPv4-compatible Supabase pooler
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const databaseUrl = process.env.DATABASE_URL;
          if (!databaseUrl) {
            throw new Error("DATABASE_URL is required.");
          }

          const url = new URL(databaseUrl);
          if (url.hostname.endsWith(".pooler.supabase.com")) {
            console.log("DATABASE_URL already uses the Supabase pooler.");
            process.exit(0);
          }

          const match = url.hostname.match(/^db\.([a-z0-9]+)\.supabase\.co$/);
          if (!match) {
            throw new Error(
              "DATABASE_URL must use a Supabase direct host or transaction pooler.",
            );
          }

          const projectRef = match[1];
          // The direct host is IPv6-only; GitHub-hosted runners require the
          // project's IPv4-capable us-west-2 transaction pooler instead.
          url.hostname = "aws-1-us-west-2.pooler.supabase.com";
          url.port = "6543";
          url.username = `postgres.${projectRef}`;
          url.searchParams.set("pgbouncer", "true");
          url.searchParams.set("schema", "scl");

          fs.appendFileSync(process.env.GITHUB_ENV, `DATABASE_URL=${url}\n`);
          console.log("Configured the production Supabase transaction pooler.");
          NODE

      - name: Promote existing owner account
        run: npx tsx scripts/ensure-owner-admin.ts
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          VERCEL_ENV: production
          OWNER_ADMIN_EMAIL: ${{ inputs.owner_email }}
