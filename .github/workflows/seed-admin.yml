name: Seed database (manual)

# Applies migrations and bootstraps an ADMIN account against whatever database
# `secrets.DATABASE_URL` points at. Demo data is NOT seeded here — the seed only
# includes it when SEED_DEMO_DATA=true, which this workflow never sets.
#
# Add required reviewers to the `production` environment in
# Settings → Environments to gate this behind an approval.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "seed production" to confirm'
        required: true
        type: string

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'seed production'
        run: |
          echo "Confirmation text did not match. Aborting." >&2
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npm run db:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Seed admin account
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
