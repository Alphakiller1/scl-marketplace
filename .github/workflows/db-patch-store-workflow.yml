name: DB patch — StoreConnection workflow columns

# One-shot, manually dispatched patch that applies the missing StoreConnection
# workflow columns + OddsUsageDaily to prod (migration 20260728033616 drift).
# Idempotent — safe to re-run. Fixes the ghost seed ("column packageCount does
# not exist") and the Winible store-connection review workflow.
#
# The Supabase DB's direct host is IPv6-only and unreachable from IPv4-only
# GitHub runners, so we don't connect to Postgres here — we POST a CRON_SECRET
# authed endpoint and let Vercel (which reaches the DB) run the idempotent DDL.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Prod base URL"
        required: false
        default: "https://scl-marketplace.vercel.app"

concurrency:
  group: db-patch-store-workflow
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply StoreConnection workflow columns via Vercel
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ github.event.inputs.base_url }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not configured." >&2
            exit 1
          fi
          BASE="${BASE_URL:-https://scl-marketplace.vercel.app}"
          echo "POST ${BASE}/api/admin/db-patch"
          HTTP=$(curl -sS -o /tmp/patch.json -w "%{http_code}" \
            -X POST "${BASE}/api/admin/db-patch" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          echo "HTTP ${HTTP}"
          cat /tmp/patch.json || true
          echo
          if [ "${HTTP}" != "200" ]; then
            echo "::error::db-patch endpoint returned HTTP ${HTTP}" >&2
            exit 1
          fi
          echo "### ✅ StoreConnection workflow columns applied" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/patch.json >> "$GITHUB_STEP_SUMMARY"
