name: DB patch — prod schema drift

# Manually dispatched, idempotent patch that brings production's schema back in
# line with prisma/migrations. Safe to re-run.
#
# Covers: StoreConnection workflow columns + OddsUsageDaily (20260728033616),
# the email/username uniqueness swap (20260805230000), CAPPER_CONTACTED
# (20260805240000), StorefrontMessage (20260805250000), and the 2024 legacy
# scopes (20260806000000) — then clears the failed `_prisma_migrations` row
# that was making `prisma migrate deploy` refuse every later migration (P3009)
# while deploys still reported success.
#
# The Supabase DB's direct host is IPv6-only and unreachable from IPv4-only
# GitHub runners, so we don't connect to Postgres here — we POST a CRON_SECRET
# authed endpoint and let Vercel (which reaches the DB) run the idempotent DDL.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Prod base URL"
        required: false
        default: "https://sportscappersleaderboard.com"

concurrency:
  group: db-patch-store-workflow
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply prod schema patch via Vercel
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ github.event.inputs.base_url }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not configured." >&2
            exit 1
          fi
          BASE="${BASE_URL:-https://sportscappersleaderboard.com}"
          echo "POST ${BASE}/api/admin/db-patch"
          HTTP=$(curl -sS -o /tmp/patch.json -w "%{http_code}" \
            -X POST "${BASE}/api/admin/db-patch" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json")
          echo "HTTP ${HTTP}"
          cat /tmp/patch.json || true
          echo
          if [ "${HTTP}" != "200" ]; then
            echo "::error::db-patch endpoint returned HTTP ${HTTP}" >&2
            exit 1
          fi
          echo "### ✅ Prod schema patch applied" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/patch.json >> "$GITHUB_STEP_SUMMARY"
