name: Enable owner-managed odds scheduling

# Hands odds population from the fixed vercel.json cron list to the owner's
# control plane, which has been inert since it shipped
# (`managedSchedulingEnabled` false => `claimDueOddsRuns` returns "disabled",
# so `OddsApiRun` has never recorded a run).
#
# Curls the deployment rather than touching the database directly, for the same
# reason db-patch-store-workflow.yml does: no GitHub runner can reach the
# Supabase host, and the repository DATABASE_URL secret points at a different
# project. Vercel reaches the real one.
#
# Fires on merge so the handover happens with the deploy, and can be
# re-dispatched afterwards. Safe to re-run: the endpoint's audit row is its own
# guard, so every call after the first changes nothing and leaves whatever the
# owners have since set in the dashboard alone. `force` overrides that.

on:
  push:
    branches: [main]
    paths:
      - "src/app/api/admin/enable-managed-odds/route.ts"
      - ".github/workflows/enable-managed-odds.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report the plan without writing
        type: boolean
        default: false
      force:
        description: Re-apply even though it already ran (overwrites owner settings)
        type: boolean
        default: false
      base_url:
        description: Override the target origin
        required: false
        type: string

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable managed scheduling via Vercel
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE_URL: ${{ github.event.inputs.base_url }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET secret is not configured." >&2
            exit 1
          fi
          BASE="${BASE_URL:-https://sportscappersleaderboard.com}"
          QUERY=""
          if [ "${DRY_RUN:-false}" = "true" ]; then QUERY="?dryRun=1"; fi
          if [ "${FORCE:-false}" = "true" ]; then QUERY="${QUERY:+$QUERY&}${QUERY:-?}force=1"; fi
          echo "POST ${BASE}/api/admin/enable-managed-odds${QUERY}"
          HTTP=$(curl -sS -o /tmp/enable.json -w "%{http_code}" \
            -X POST "${BASE}/api/admin/enable-managed-odds${QUERY}" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          cat /tmp/enable.json
          echo
          if [ "$HTTP" != "200" ]; then
            echo "::error::endpoint returned HTTP ${HTTP}" >&2
            exit 1
          fi
